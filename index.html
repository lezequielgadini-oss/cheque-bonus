function campoBase(x, chave){
  var d = x.dados || {}, ruins = /telefone|fone|celular|email|e-mail|cpf|creci|imobiliaria|data|valor/;
  var ks = Object.keys(d).filter(function(k){ var n = norm(k); return n.indexOf(chave) >= 0 && !ruins.test(n) && String(d[k]).trim(); });
  if (!ks.length) ks = Object.keys(d).filter(function(k){ return norm(k).indexOf(chave) >= 0 && String(d[k]).trim(); });
  return ks.length ? String(d[ks[0]]).trim() : '';
}
function infoPessoa(x, semCorretor){
  var p = [], c = x.cpf != null && x.cpf !== '' ? fmtCPF(x.cpf) : (x.cpf_mask || '');
  p.push(c ? 'CPF ' + c : 'sem CPF');
  if (x.telefone) p.push(x.telefone);
  if (x.corretor && !semCorretor) p.push('Corretor: ' + x.corretor);
  if (x.embarque_em) p.push('check-in ' + fmtHora(x.embarque_em));

function criarPad(canvas, aoMudar){
  var ctx = canvas.getContext('2d'), desenhando = false, last = null, prevMid = null, sujo = false, largura = 0, altura = 0;
  function estilo(){ ctx.lineWidth = 2.8; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0b1b2b'; ctx.fillStyle = '#0b1b2b'; }
  function ajustar(){
    var r = canvas.getBoundingClientRect(); if (!r.width || (Math.round(r.width) === largura && Math.round(r.height) === altura)) return;
    var dpr = window.devicePixelRatio || 1, img = sujo ? canvas.toDataURL() : null;
    largura = Math.round(r.width); altura = Math.round(r.height);
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); estilo();
    if (img){ var im = new Image(); im.onload = function(){ ctx.drawImage(im, 0, 0, r.width, r.height); }; im.src = img; }
  }
  function pos(e){ var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  canvas.addEventListener('pointerdown', function(e){
    e.preventDefault(); canvas.setPointerCapture(e.pointerId);
    desenhando = true; last = pos(e); prevMid = last;
    ctx.beginPath(); ctx.arc(last.x, last.y, 1.4, 0, Math.PI * 2); ctx.fill();
    if (!sujo){ sujo = true; aoMudar(true); }
  });
  canvas.addEventListener('pointermove', function(e){
    if (!desenhando) return; e.preventDefault();
    var p = pos(e), mid = { x: (last.x + p.x) / 2, y: (last.y + p.y) / 2 };
    ctx.beginPath(); ctx.moveTo(prevMid.x, prevMid.y); ctx.quadraticCurveTo(last.x, last.y, mid.x, mid.y); ctx.stroke();
    last = p; prevMid = mid;
  });
  function fim(){ desenhando = false; }
  canvas.addEventListener('pointerup', fim); canvas.addEventListener('pointercancel', fim); canvas.addEventListener('pointerleave', fim);
  if (window.ResizeObserver) new ResizeObserver(ajustar).observe(canvas); else window.addEventListener('resize', ajustar);
  ajustar();
  return {
    limpar: function(){ ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height); ctx.restore(); sujo = false; aoMudar(false); },
    vazio: function(){ return !sujo; },
    dataURL: function(){ return canvas.toDataURL('image/png'); },
    blob: function(){ return new Promise(function(r){ canvas.toBlob(r, 'image/png'); }); },
    w: function(){ return canvas.width; }, h: function(){ return canvas.height; }
  };
}
function gerarPDF(d){
  var jsPDF = window.jspdf.jsPDF, doc = new jsPDF({ unit: 'mm', format: 'a4' });
  var W = 210, M = 22, emp = d.emp || '', empresa = S.cfg.empresa || 'Emais Urbanismo';

  for (var i = 0; i < 30; i++){
    var x0 = i * b / 2 - 9; doc.setFillColor.apply(doc, cores[i % cores.length]);
    if (i % 2 === 0) doc.triangle(x0, h, x0 + b, h, x0 + b / 2, 0, 'F'); else doc.triangle(x0, 0, x0 + b, 0, x0 + b / 2, h, 'F');
  }
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(30,117,106); doc.text(empresa.toUpperCase(), M, 34, { charSpace: 0.6 });
  doc.setFontSize(26); doc.setTextColor(19,12,14); doc.text('Confirmação de retirada', M, 47);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(13); doc.setTextColor(47,72,88); doc.text('Cheque Bônus ' + emp, M, 55);
  doc.setDrawColor(24,182,140); doc.setLineWidth(0.9); doc.line(M, 61, M + 28, 61);
  var y = 80; doc.setFont('helvetica', 'normal'); doc.setFontSize(13); doc.setTextColor(30,40,48);
  paragrafos(d).forEach(function(p){
    var lines = doc.splitTextToSize(p, W - 2 * M);
    doc.text(lines, M, y, { lineHeightFactor: 1.5 });
    y += lines.length * 6.4 + 5;
  });
  if (y + 80 > 280){ doc.addPage(); y = 30; }
  var by = y + 26, bw = 100, bh = 28;
  var iw = bw, ih = bw * d.sigH / d.sigW; if (ih > bh){ ih = bh; iw = bh * d.sigW / d.sigH; }
  doc.addImage(d.sigURL, 'PNG', M + (bw - iw) / 2, by + bh - ih, iw, ih);
  doc.setDrawColor(19,12,14); doc.setLineWidth(0.3); doc.line(M, by + bh + 1, M + bw, by + bh + 1);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(19,12,14); doc.text(d.nome, M, by + bh + 6);
  doc.setFont('helvetica', 'normal'); doc.text(d.cpf ? rotDoc(d.cpf) + ' ' + fmtCPF(d.cpf) : 'CPF não informado', M, by + bh + 11);
  doc.setFontSize(9); doc.setTextColor(74,96,112); doc.text('Assinatura do(a) cliente', M, by + bh + 16);
  if (S.cfg.responsavel && String(S.cfg.responsavel).trim()) doc.text('Responsável pela entrega: ' + String(S.cfg.responsavel).trim(), M, by + bh + 24);
  doc.setFontSize(8); doc.setTextColor(110,126,138);

}

  }

async function atualizarCk(){
  var meu = ++seqCk, jobs = [S.sb.rpc('lista_checkins'), S.sb.rpc('controle_vans')], buscou = S.ck.termo.trim().length >= 3;
  if (buscou) jobs.push(S.sb.rpc('buscar_para_checkin', { p_termo: S.ck.termo }));
  var res = await Promise.all(jobs);
  if (meu !== seqCk || S.view !== 'checkin' || !$('#ck-lista')) return;
  if (res[0].error){ $('#ck-lista').innerHTML = msg('Erro ao carregar a lista: ' + traduzErro(res[0].error), 'err'); return; }
  S.ck.lista = res[0].data || [];
  if (!res[1].error) S.vans = res[1].data || [];
  S.ck.resultados = buscou ? (res[2].error ? [] : (res[2].data || [])) : null;
  if (buscou && res[2].error) toast('Erro na busca: ' + traduzErro(res[2].error));
  desenharCk();
  clearTimeout(timerCk);
  timerCk = setTimeout(function(){ if (S.view === 'checkin') atualizarCk(); }, 20000);
}
function desenharCk(){
  if (!$('#ck-lista')) return;
  var l = S.ck.lista, n = { aguarda: 0, doc: 0 }, pessoas = 0;
  var semTour = 0;
  l.forEach(function(x){ var e = etapaCk(x); if (n[e] != null) n[e]++; if (x.sem_tour) semTour++; else pessoas += 1 + (Number(x.acompanhantes) || 0); });
  $('#ck-cont').innerHTML =
    '<div class="cont"><b>' + l.length + '</b><span>Check-ins feitos</span></div>' +
    '<div class="cont"><b>' + pessoas + '</b><span>Pessoas no tour</span></div>' +
    '<div class="cont"><b>' + n.aguarda + '</b><span>Aguardando documento</span></div>' +
    '<div class="cont"><b>' + n.doc + '</b><span>Documento gerado</span></div>' +
    '<div class="cont"><b>' + semTour + '</b><span>Não vão ao tour</span></div>';
  var filtros = [['todos', 'Todos'], ['aguarda', 'Aguardando documento'], ['doc', 'Documento gerado']];
  $('#ck-filtros').innerHTML = filtros.map(function(f){
    return '<button type="button" data-filtro="' + f[0] + '"' + (S.ck.filtro === f[0] ? ' aria-current="page"' : '') + '>' + f[1] + '</button>';
  }).join('');
  $('#ck-filtros').querySelectorAll('[data-filtro]').forEach(function(b){
    b.addEventListener('click', function(){ S.ck.filtro = b.getAttribute('data-filtro'); desenharCk(); });
  });
  var vis = l.filter(function(x){ return S.ck.filtro === 'todos' || etapaCk(x) === S.ck.filtro; });
  $('#ck-lista').innerHTML = vis.length ? '<div class="lista">' + vis.map(linhaCk).join('') + '</div>' : msg('Nenhum cliente nesta lista ainda.', 'info');
  var r = S.ck.resultados;
  $('#ck-res').innerHTML = r === null ? '' : (r.length ? '<div class="lista">' + r.map(linhaCk).join('') + '</div>' : msg('Ninguém encontrado. Se o cliente não está na planilha, use o Cadastro manual.', 'warn'));
  document.querySelectorAll('[data-ck]').forEach(function(b){
    b.addEventListener('click', function(){ acaoCk(b.getAttribute('data-id'), b.getAttribute('data-ck')); });
  });
}
async function acaoCk(id, etapa){
  if (etapa === 'abrir' || etapa === 'editar'){
    var x = S.ck.lista.concat(S.ck.resultados || []).filter(function(y){ return String(y.cliente_id) === String(id); })[0];
    if (!x) return;
    return abrirEmbarque({ cliente_id: x.cliente_id, nome: titulo(x.nome), van: x.van, acompanhantes: x.acompanhantes, sem_tour: x.sem_tour }, atualizarCk);
  }

  var r = await S.sb.rpc('registrar_checkin', { p_cliente_id: Number(id), p_etapa: etapa, p_van: null, p_acompanhantes: 0 });
  if (r.error) toast('Não foi possível registrar: ' + traduzErro(r.error));

function renderVans(){

async function atualizarVans(){
  var meu = ++seqCk, r = await S.sb.rpc('controle_vans');
  if (meu !== seqCk || S.view !== 'vans' || !$('#vn-corpo')) return;
  if (r.error){ $('#vn-corpo').innerHTML = msg('Erro ao carregar as vans: ' + traduzErro(r.error), 'err'); return; }
  S.vans = r.data || [];
  desenharVans();
  clearTimeout(timerCk);
  timerCk = setTimeout(function(){ if (S.view === 'vans') atualizarVans(); }, 20000);
}
function desenharVans(){
  S.vanFechada = S.vanFechada || {};
  var cap = capVan(), rows = S.vans || [], occ = ocupacaoVans(rows), mx = maiorVan(occ), v, html = '', lotadas = 0, pessoas = 0, emUso = 0;
  for (v = 1; v <= mx; v++){
    var lista = rows.filter(function(r){ return r.van === v; }), usados = occ[v] || 0;
    if (!lista.length) continue;
    emUso++; pessoas += usados; if (usados >= cap) lotadas++;
    var fechada = !!S.vanFechada[v];
    html += '<section class="card stack"><div class="row" style="justify-content:space-between;align-items:center"><button type="button" class="van-toggle" data-van-toggle="' + v + '" aria-expanded="' + (!fechada) + '" aria-label="' + (fechada ? 'Maximizar' : 'Minimizar') + ' Van ' + v + '"><span class="seta">' + (fechada ? '+' : '-') + '</span><h3 style="margin:0">Van ' + v + '</h3></button>' +
      '<span class="tag ' + (usados >= cap ? 'etapa-van' : 'etapa-chegou') + '">' + (usados >= cap ? 'Lotada' : (cap - usados) + ' vagas') + '</span></div>' +
      '<div class="barra"><i style="width:' + Math.min(100, Math.round(usados * 100 / cap)) + '%"></i></div>' +
      '<p class="muted" style="margin:0">' + usados + ' de ' + cap + ' lugares ocupados</p>' +
      (fechada ? '' : '<div class="lista">' + lista.map(function(r){
        var a = Number(r.acompanhantes) || 0;
        return '<div class="item"><div class="info"><b>' + esc(titulo(r.nome)) + '</b><span>' + (a ? '+' + a + (a === 1 ? ' acompanhante' : ' acompanhantes') : 'sem acompanhantes') + ' | ' + (1 + a) + (a ? ' pessoas' : ' pessoa') + ' | check-in ' + esc(fmtHora(r.embarque_em)) + '</span></div>' +
          (r.manual ? '<span class="tag manual">Cadastro manual</span>' : '') + (r.doc_gerado ? '<span class="tag etapa-van">Documento gerado</span>' : '') + (leitor() ? '' : '<div class="acoes"><button class="btn sec sm" type="button" data-van-edit="' + esc(r.cliente_id) + '">Editar pessoas</button></div>') + '</div>';
      }).join('') + '</div>') + '</section>';
  }
  $('#vn-cont').innerHTML = '<div class="cont"><b>' + emUso + '</b><span>Vans em uso</span></div><div class="cont"><b>' + lotadas + '</b><span>Vans lotadas</span></div><div class="cont"><b>' + pessoas + '</b><span>Pessoas nas vans</span></div>';
  $('#vn-corpo').innerHTML = html || msg('Nenhuma van com passageiros ainda.', 'info');
  document.querySelectorAll('[data-van-toggle]').forEach(function(b){
    b.addEventListener('click', function(){ var n = b.getAttribute('data-van-toggle'); S.vanFechada[n] = !S.vanFechada[n]; desenharVans(); });
  });
  document.querySelectorAll('[data-van-edit]').forEach(function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-van-edit');
      var x = (S.vans || []).filter(function(y){ return String(y.cliente_id) === String(id); })[0];
      if (x) editarPessoas(x);
    });
  });
}
/* editar a quantidade de acompanhantes depois do check-in */
function editarPessoas(x){
  var cap = capVan(), acomp = Number(x.acompanhantes) || 0, van = x.van;
  var fundo = document.createElement('div'); fundo.className = 'modal-fundo';
  fundo.innerHTML = '<div class="modal card stack" role="dialog" aria-modal="true"><h2>Editar pessoas de ' + esc(titulo(x.nome)) + '</h2>' +
    '<p class="muted" style="margin:0">Hoje na <b>Van ' + van + '</b>.</p>' +
    '<div><label>Quantos acompanhantes vão com o cliente?</label>' +
    '<div class="stepper"><button class="btn sec" id="e-menos" type="button" aria-label="Menos um">-</button><output id="e-val">0</output><button class="btn sec" id="e-mais" type="button" aria-label="Mais um">+</button></div>' +
    '<p class="muted" id="e-total" style="margin:6px 0 0"></p></div><div id="e-aviso"></div>' +
    '<div id="mdl-msg"></div><div class="row"><button class="btn" id="e-ok" type="button">Salvar</button><button class="btn sec" id="e-cancel" type="button">Cancelar</button></div></div>';
  document.body.appendChild(fundo);
  function fechar(){ fundo.remove(); }
  function destino(){
    var occ = ocupacaoVans(S.vans, x.cliente_id), seats = 1 + acomp, d = van;
    while ((occ[d] || 0) + seats > cap) d++;
    return d;
  }
  function pintar(){
    var seats = 1 + acomp, d = destino();
    $('#e-val').textContent = acomp;
    $('#e-total').textContent = 'Total: ' + seats + (seats === 1 ? ' pessoa (só o cliente)' : ' pessoas (cliente + ' + acomp + ')') + '. Cada van leva ' + cap + '.';
    $('#e-menos').disabled = acomp <= 0; $('#e-mais').disabled = acomp >= cap - 1;
    $('#e-aviso').innerHTML = d !== van ? msg('Não cabe na Van ' + van + '. O grupo será levado para a Van ' + d + '.', 'warn') : '';
  }
  $('#e-menos').addEventListener('click', function(){ if (acomp > 0){ acomp--; pintar(); } });
  $('#e-mais').addEventListener('click', function(){ if (acomp < cap - 1){ acomp++; pintar(); } });
  $('#e-cancel').addEventListener('click', fechar);
  $('#e-ok').addEventListener('click', async function(){
    var b = $('#e-ok'); b.disabled = true; $('#mdl-msg').innerHTML = msg('Salvando...', 'info');
    var r = await S.sb.rpc('ajustar_acompanhantes', { p_cliente_id: Number(x.cliente_id), p_acompanhantes: acomp });
    if (r.error){
      $('#mdl-msg').innerHTML = msg(traduzErro(r.error), 'err');
      await carregarVans(); pintar(); b.disabled = false; return;
    }
    var o = Array.isArray(r.data) ? r.data[0] : r.data;
    fechar();
    toast(o && o.mudou_de_van ? 'Atualizado. Grupo levado para a Van ' + o.van : 'Atualizado na Van ' + (o ? o.van : van));
    atualizarVans();
  });
  pintar();
}

async function adminBase(){
  $('#admin-corpo').innerHTML = '<section class="card stack"><h2>Base de clientes</h2><div id="contagem">' + msg('Contando...', 'info') + '</div>' +
    '<div><label for="arquivo">Planilha do Excel (.xlsx, .xls ou .csv)</label><input id="arquivo" type="file" accept=".xlsx,.xls,.csv"></div>' +
    '<p class="muted" style="margin:0">A planilha precisa ter uma coluna com o CPF e outra com o nome. Uma coluna de valor do bônus é opcional. Todas as outras colunas ficam disponíveis na tela de busca.</p>' +
    '<div id="imp"></div></section>';
  var n = await S.sb.rpc('contar_clientes');
  $('#contagem').innerHTML = n.error ? msg('Não foi possível contar: ' + traduzErro(n.error), 'err') : msg('Clientes na base: ' + (n.data || 0), 'info');
  $('#arquivo').addEventListener('change', async function(ev){
    var f = ev.target.files[0]; if (!f) return;
    try {
      var wb = XLSX.read(await f.arrayBuffer(), { type: 'array', cellDates: true, dateNF: 'dd/mm/yyyy' });
      var nomeAba = wb.SheetNames[0], rows = XLSX.utils.sheet_to_json(wb.Sheets[nomeAba], { defval: '', raw: false, dateNF: 'dd/mm/yyyy' });
      if (!rows.length){ $('#imp').innerHTML = msg('A planilha está vazia.', 'warn'); return; }
      var heads = Object.keys(rows[0]);
      function achar(pred){ return heads.find(function(h){ return pred(norm(h)); }) || ''; }
      S.imp = { rows: rows, heads: heads, aba: nomeAba, arq: f.name, map: {
        cpf: achar(function(h){ return h.indexOf('cpf') >= 0; }),
        nome: achar(function(h){ return h === 'nome' || h === 'cliente' || h.indexOf('nome') >= 0; }),
        valor: achar(function(h){ return h.indexOf('valor') >= 0 || h.indexOf('bonus') >= 0; }) } };
      impTela();
    } catch (e){ $('#imp').innerHTML = msg('Não foi possível ler o arquivo: ' + traduzErro(e), 'err'); }
  });
}
function processarImp(){
  var m = S.imp.map, vistos = {}, validos = [], invalidos = [], dup = 0;
  S.imp.rows.forEach(function(r, i){
    var d = onlyDigits(r[m.cpf]);
    var nome = String(r[m.nome] == null ? '' : r[m.nome]).trim();
    if (!nome){ invalidos.push(i + 2); return; }
    var chave = d || ('sem:' + norm(nome));
    if (vistos[chave]) dup++;
    var dados = {}; S.imp.heads.forEach(function(h){ var v = r[h]; if (v !== '' && v != null) dados[h] = String(v); });
    vistos[chave] = { cpf: d, nome: nome, valor_bonus: m.valor ? parseValor(r[m.valor]) : null, dados: dados };
  });
  Object.keys(vistos).forEach(function(k){ validos.push(vistos[k]); });
  return { validos: validos, invalidos: invalidos, dup: dup };
}
function impTela(){
  var m = S.imp.map;

  }
  $('#imp').innerHTML = '<div class="stack"><div class="msg info">Arquivo: ' + esc(S.imp.arq) + ' (aba ' + esc(S.imp.aba) + ', ' + S.imp.rows.length + ' linhas)</div>' +
    '<div class="row">' + sel('m-cpf', 'Coluna do CPF/CNPJ', m.cpf, false) + sel('m-nome', 'Coluna do nome', m.nome, false) + sel('m-valor', 'Coluna do valor do bônus', m.valor, true) + '</div>' +
    '<div id="resumo"></div>' +
    (S.papel === 'admin' ? '<label class="chk"><input type="checkbox" id="substituir"> ZERAR o sistema antes de importar: apaga todos os clientes, check-ins, vans e documentos gerados</label><div id="zerar-box" style="display:none"><label for="zerar-conf">Para confirmar, digite ZERAR</label><input id="zerar-conf" type="text" autocomplete="off" placeholder="ZERAR"></div>' : '<div class="msg info">Clientes com o mesmo CPF são atualizados e novos são adicionados. Ninguém é apagado.</div>') +
    '<button class="btn" id="importar">Importar</button><div id="imp-msg"></div></div>';
  function atualizar(){
    S.imp.map = { cpf: $('#m-cpf').value, nome: $('#m-nome').value, valor: $('#m-valor').value };
    if (!S.imp.map.cpf || !S.imp.map.nome){ $('#resumo').innerHTML = msg('Escolha as colunas do CPF e do nome.', 'warn'); $('#importar').disabled = true; return; }
    var p = processarImp();
    $('#resumo').innerHTML = msg(p.validos.length + ' clientes válidos' + (p.dup ? ', ' + p.dup + ' CPF/CNPJ repetido(s) na planilha (vale a última linha)' : '') +
      (p.invalidos.length ? ', ' + p.invalidos.length + ' linha(s) ignorada(s) por nome vazio (ex.: linhas ' + p.invalidos.slice(0, 6).join(', ') + ')' : '') + '.', p.invalidos.length ? 'warn' : 'ok');
    $('#importar').disabled = !p.validos.length;
  }
  ['m-cpf', 'm-nome', 'm-valor'].forEach(function(id){ $('#' + id).addEventListener('change', atualizar); });
  if ($('#substituir')) $('#substituir').addEventListener('change', function(){ $('#importar').textContent = this.checked ? 'Zerar tudo e importar' : 'Importar'; $('#zerar-box').style.display = this.checked ? 'block' : 'none'; });
  $('#importar').addEventListener('click', importar);
  atualizar();
}
async function importar(){
  var btn = $('#importar'), out = $('#imp-msg'), p = processarImp(), subst = !!($('#substituir') && $('#substituir').checked) && S.papel === 'admin';
  if (subst && ($('#zerar-conf').value || '').trim().toUpperCase() !== 'ZERAR'){ out.innerHTML = msg('Digite ZERAR no campo de confirmação para apagar tudo e importar.', 'warn'); return; }
  btn.disabled = true; out.innerHTML = msg('Importando...', 'info');
  try {
    if (subst){
      out.innerHTML = msg('Apagando arquivos dos documentos...', 'info');
      var ds = await S.sb.from('documentos_bonus').select('pdf_path,assinatura_path');
      if (ds.error) throw ds.error;
      var caminhos = [];
      (ds.data || []).forEach(function(d){ if (d.pdf_path) caminhos.push(d.pdf_path); if (d.assinatura_path) caminhos.push(d.assinatura_path); });
      for (var j = 0; j < caminhos.length; j += 100){
        var rm = await S.sb.storage.from(BUCKET).remove(caminhos.slice(j, j + 100));
        if (rm.error) throw rm.error;
      }
      out.innerHTML = msg('Zerando o sistema...', 'info');
      var del = await S.sb.rpc('zerar_evento');
      if (del.error) throw del.error;
    }
    for (var i = 0; i < p.validos.length; i += 500){
      var up = await S.sb.rpc('importar_clientes', { p_lote: p.validos.slice(i, i + 500) });
      if (up.error) throw up.error;
      out.innerHTML = msg('Importando... ' + Math.min(i + 500, p.validos.length) + ' de ' + p.validos.length, 'info');
    }
    out.innerHTML = msg('Importação concluída: ' + p.validos.length + ' clientes.', 'ok');
    var n = await S.sb.rpc('contar_clientes');
    if (!n.error) $('#contagem').innerHTML = msg('Clientes na base: ' + (n.data || 0), 'info');
  } catch (e){ out.innerHTML = msg('Falha na importação: ' + traduzErro(e), 'err'); }
  btn.disabled = false;
}

function tempoEntre(a, b){
  if (!a || !b) return '';
  var m = Math.round((new Date(b) - new Date(a)) / 60000);
  if (m < 0) return '';
  return m < 60 ? m + ' min' : Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0');
