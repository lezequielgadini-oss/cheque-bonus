const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function onlyDigits(s){ return String(s == null ? '' : s).replace(/\D/g, ''); }

var D = ['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];

function ate999(n){
  if (n === 100) return 'cem';

  var partes = [], valores = [];

async function chamarUsuarios(body){
  var r = await S.sb.functions.invoke('gerenciar-usuarios', { body: body });
  if (r.error){
    var m = r.error.message;
    try {
      if (r.error.context && r.error.context.json){
        var j = await r.error.context.json();
        if (j && j.erro) m = j.erro;
      }
    } catch (e){}
    throw new Error(m);
  }
  if (r.data && r.data.erro) throw new Error(r.data.erro);
  return r.data;
}
function gerarSenha(){
  var al = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789', b = new Uint32Array(10), s = '';
  crypto.getRandomValues(b);
  for (var i = 0; i < b.length; i++) s += al.charAt(b[i] % al.length);
  return s;
}

async function entrar(user){
  S.user = user;
  zerarInatividade();
  var p = await S.sb.from('perfis').select('papel').eq('id', user.id).maybeSingle();
  S.papel = (p.data && p.data.papel) || 'operador';
  var c = await S.sb.from('configuracoes').select('valor').eq('chave', 'documento').maybeSingle();
  if (c.data && c.data.valor) S.cfg = Object.assign(S.cfg, c.data.valor);
  var ea = await S.sb.rpc('existe_admin');
  S.semAdmin = ea.error ? false : ea.data === false;
  S.view = 'busca'; S.cliente = null;
  render();
}

async function buscar(){
  var d = onlyDigits($('#cpf').value), out = $('#resultado');
  if (d.length !== 11){ out.innerHTML = msg('Digite os 11 números do CPF.', 'warn'); return; }
  out.innerHTML = msg('Buscando...', 'info');
  var r = await S.sb.rpc('buscar_cliente', { p_cpf: d });
  if (r.error){ out.innerHTML = msg('Erro na busca: ' + traduzErro(r.error), 'err'); return; }
  if (!r.data || !r.data.length){ S.cliente = null; out.innerHTML = msg('CPF não encontrado na base.', 'warn'); return; }
  S.cliente = r.data[0];
  mostrarCliente();
}
function mostrarCliente(){
  var c = S.cliente, dados = c.dados || {}, extras = [];
  Object.keys(dados).forEach(function(k){
    var v = dados[k], nk = norm(k);
    if (v === '' || v == null || nk.indexOf('cpf') >= 0 || String(v) === c.nome) return;
    extras.push('<div><dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd></div>');

function criarPad(canvas, aoMudar){
  var ctx = canvas.getContext('2d'), desenhando = false, last = null, prevMid = null, sujo = false, largura = 0, altura = 0;
  function estilo(){ ctx.lineWidth = 2.8; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0b1b2b'; ctx.fillStyle = '#0b1b2b'; }
  function ajustar(){
    var r = canvas.getBoundingClientRect(); if (!r.width || (Math.round(r.width) === largura && Math.round(r.height) === altura)) return;
    var dpr = window.devicePixelRatio || 1, img = sujo ? canvas.toDataURL() : null;
    largura = Math.round(r.width); altura = Math.round(r.height);
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); estilo();
    if (img){ var im = new Image(); im.onload = function(){ ctx.drawImage(im, 0, 0, r.width, r.height); }; im.src = img; }
  }
  function pos(e){ var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  canvas.addEventListener('pointerdown', function(e){
    e.preventDefault(); canvas.setPointerCapture(e.pointerId);
    desenhando = true; last = pos(e); prevMid = last;
    ctx.beginPath(); ctx.arc(last.x, last.y, 1.4, 0, Math.PI * 2); ctx.fill();
    if (!sujo){ sujo = true; aoMudar(true); }
  });
  canvas.addEventListener('pointermove', function(e){
    if (!desenhando) return; e.preventDefault();
    var p = pos(e), mid = { x: (last.x + p.x) / 2, y: (last.y + p.y) / 2 };
    ctx.beginPath(); ctx.moveTo(prevMid.x, prevMid.y); ctx.quadraticCurveTo(last.x, last.y, mid.x, mid.y); ctx.stroke();
    last = p; prevMid = mid;
  });
  function fim(){ desenhando = false; }
  canvas.addEventListener('pointerup', fim); canvas.addEventListener('pointercancel', fim); canvas.addEventListener('pointerleave', fim);
  if (window.ResizeObserver) new ResizeObserver(ajustar).observe(canvas); else window.addEventListener('resize', ajustar);
  ajustar();
  return {
    limpar: function(){ ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height); ctx.restore(); sujo = false; aoMudar(false); },
    vazio: function(){ return !sujo; },
    dataURL: function(){ return canvas.toDataURL('image/png'); },
    blob: function(){ return new Promise(function(r){ canvas.toBlob(r, 'image/png'); }); },
    w: function(){ return canvas.width; }, h: function(){ return canvas.height; }
  };
}
function gerarPDF(d){
  var jsPDF = window.jspdf.jsPDF, doc = new jsPDF({ unit: 'mm', format: 'a4' });
  var W = 210, M = 22, emp = S.cfg.empreendimento || 'EPLENUM RESERVE', empresa = S.cfg.empresa || 'Emais Urbanismo';
  var cores = [[24,182,140],[30,117,106],[78,216,176],[45,140,126],[47,72,88]], b = 18, h = 16;
  for (var i = 0; i < 30; i++){
    var x0 = i * b / 2 - 9; doc.setFillColor.apply(doc, cores[i % cores.length]);
    if (i % 2 === 0) doc.triangle(x0, h, x0 + b, h, x0 + b / 2, 0, 'F'); else doc.triangle(x0, 0, x0 + b, 0, x0 + b / 2, h, 'F');
  }
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(30,117,106); doc.text(empresa.toUpperCase(), M, 34, { charSpace: 0.6 });
  doc.setFontSize(26); doc.setTextColor(19,12,14); doc.text('Parabenização', M, 47);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(13); doc.setTextColor(47,72,88); doc.text('Cheque Bônus ' + emp, M, 55);
  doc.setDrawColor(24,182,140); doc.setLineWidth(0.9); doc.line(M, 61, M + 28, 61);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.setTextColor(19,12,14);
  doc.text('Parabéns, ' + (d.nome.split(' ')[0] || '') + '!', M, 76);
  var y = 88; doc.setFont('helvetica', 'normal'); doc.setFontSize(12); doc.setTextColor(30,40,48);
  paragrafos(d).forEach(function(p){
    var lines = doc.splitTextToSize(p, W - 2 * M);
    doc.text(lines, M, y, { lineHeightFactor: 1.5 });
    y += lines.length * 6.4 + 5;
  });
  if (y + 62 > 280){ doc.addPage(); y = 30; }
  var by = Math.max(y + 16, 200), bw = 100, bh = 28;
  var iw = bw, ih = bw * d.sigH / d.sigW; if (ih > bh){ ih = bh; iw = bh * d.sigW / d.sigH; }
  doc.addImage(d.sigURL, 'PNG', M + (bw - iw) / 2, by + bh - ih, iw, ih);
  doc.setDrawColor(19,12,14); doc.setLineWidth(0.3); doc.line(M, by + bh + 1, M + bw, by + bh + 1);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(19,12,14); doc.text(d.nome, M, by + bh + 6);
  doc.setFont('helvetica', 'normal'); doc.text('CPF ' + fmtCPF(d.cpf), M, by + bh + 11);
  doc.setFontSize(9); doc.setTextColor(74,96,112); doc.text('Assinatura do(a) cliente', M, by + bh + 16);
  if (S.cfg.responsavel && String(S.cfg.responsavel).trim()) doc.text('Responsável pela entrega: ' + String(S.cfg.responsavel).trim(), M, by + bh + 24);
  doc.setFontSize(8); doc.setTextColor(110,126,138);
  doc.text('Protocolo ' + d.protocolo + '  |  Gerado em ' + new Date().toLocaleString('pt-BR'), M, 288);
  return doc.output('blob');
}
async function salvar(){
  var btn = $('#salvar'), out = $('#doc-msg'), c = S.cliente;
  if (S.pad.vazio()){ out.innerHTML = msg('Peça ao cliente para assinar na área indicada.', 'warn'); return; }
  var f = lerFormDoc();
  if ($('#valor').value.trim() && (f.valor == null || f.valor <= 0)){ out.innerHTML = msg('O valor informado não é válido.', 'warn'); return; }
  btn.disabled = true; btn.textContent = 'Salvando...'; out.innerHTML = '';
  try {
    var id = novoId(), protocolo = id.slice(0, 8).toUpperCase(), base = S.user.id + '/' + id;
    var pdf = gerarPDF({ nome: f.nome, cpf: f.cpf, valor: f.valor, data: f.data, protocolo: protocolo,
      sigURL: S.pad.dataURL(), sigW: S.pad.w(), sigH: S.pad.h() });
    var sig = await S.pad.blob();
    var up1 = await S.sb.storage.from(BUCKET).upload(base + '.pdf', pdf, { contentType: 'application/pdf' });
    if (up1.error) throw up1.error;
    var up2 = await S.sb.storage.from(BUCKET).upload(base + '-assinatura.png', sig, { contentType: 'image/png' });
    if (up2.error) throw up2.error;
    var ins = await S.sb.from('documentos_bonus').insert({
      id: id, cliente_id: c.id, cpf: c.cpf, nome: f.nome, valor_bonus: f.valor,
      empreendimento: S.cfg.empreendimento || 'EPLENUM RESERVE', data_retirada: f.dataISO,
      assinatura_path: base + '-assinatura.png', pdf_path: base + '.pdf'
    });
    if (ins.error) throw ins.error;
    S.ultimo = { blob: pdf, nome: 'Cheque-Bonus-' + slug(f.nome) + '-' + protocolo + '.pdf', protocolo: protocolo, cliente: f.nome };
    S.view = 'ok'; render();
  } catch (e){
    btn.disabled = false; btn.textContent = 'Confirmar assinatura e salvar';
    out.innerHTML = msg('Não foi possível salvar: ' + traduzErro(e), 'err');
  }
}
function renderOk(){
  var u = S.ultimo;
  if (!u){ S.view = 'busca'; return renderBusca(); }
  app.innerHTML = shell('<section class="card stack"><span class="tag">Documento salvo</span><h2>Pronto, ' + esc(u.cliente) + ' assinou.</h2>' +

function baixarBlob(blob, nome){
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

    '<div class="grow" style="max-width:340px"><label for="filtro">Filtrar por nome ou CPF</label><input id="filtro" type="text" autocomplete="off"></div></div>' +
    '<div id="lista" class="lista">' + msg('Carregando...', 'info') + '</div></section>');

  var r = await S.sb.from('documentos_bonus').select('id,numero,cpf,nome,valor_bonus,data_retirada,criado_em,criado_por,pdf_path').order('criado_em', { ascending: false }).limit(300);
  var lista = $('#lista');
  if (r.error){ lista.innerHTML = msg('Erro ao carregar: ' + traduzErro(r.error), 'err'); return; }
  var docs = r.data || [], emails = {};
  if (S.papel === 'admin'){
    var pf = await S.sb.from('perfis').select('id,email');
    (pf.data || []).forEach(function(p){ emails[p.id] = p.email; });
  }
  function desenhar(){
    var q = norm($('#filtro').value), d = onlyDigits($('#filtro').value);
    var vis = docs.filter(function(x){ return !q || norm(x.nome).indexOf(q) >= 0 || (d && x.cpf.indexOf(d) >= 0); });
    if (!vis.length){ lista.innerHTML = msg(docs.length ? 'Nenhum documento com esse filtro.' : 'Nenhum documento gerado ainda.', 'info'); return; }
    lista.innerHTML = vis.map(function(x){
      return '<div class="item"><div class="info"><b>' + esc(x.nome) + '</b><span>CPF ' + esc(maskCPFLista(x.cpf)) +
        (x.valor_bonus != null ? ' | ' + esc(brl(Number(x.valor_bonus))) : '') +
        ' | Retirada ' + esc(dataISOparaBR(x.data_retirada)) + ' | Protocolo ' + esc(x.id.slice(0, 8).toUpperCase()) +
        (S.papel === 'admin' && emails[x.criado_por] ? ' | Atendente ' + esc(emails[x.criado_por]) : '') + '</span></div>' +
        '<button class="btn sec sm" data-pdf="' + esc(x.id) + '">Baixar PDF</button></div>';
    }).join('');
    lista.querySelectorAll('[data-pdf]').forEach(function(b){
      b.addEventListener('click', async function(){
        var x = docs.find(function(y){ return y.id === b.getAttribute('data-pdf'); });
        b.disabled = true;
        var dl = await S.sb.storage.from(BUCKET).download(x.pdf_path);
        b.disabled = false;
        if (dl.error){ toast('Não foi possível baixar: ' + traduzErro(dl.error)); return; }
        baixarBlob(dl.data, 'Cheque-Bonus-' + slug(x.nome) + '-' + x.id.slice(0, 8).toUpperCase() + '.pdf');
      });
    });
  }
  $('#filtro').addEventListener('input', desenhar);
  desenhar();
}

/* ---------------- administração ---------------- */
function renderAdmin(){
  function t(id, nome){ return '<button data-sub="' + id + '"' + (S.adminTab === id ? ' aria-current="page"' : '') + '>' + nome + '</button>'; }
  app.innerHTML = shell('<div class="subtabs">' + t('base', 'Base de clientes') + t('config', 'Configurações do documento') + t('usuarios', 'Usuários') + '</div><div id="admin-corpo"></div>');
  ligarShell();
  document.querySelectorAll('[data-sub]').forEach(function(b){
    b.addEventListener('click', function(){ S.adminTab = b.getAttribute('data-sub'); renderAdmin(); });
  });
  if (S.adminTab === 'base') adminBase();
  else if (S.adminTab === 'config') adminConfig();
  else adminUsuarios();
}
async function adminBase(){
  $('#admin-corpo').innerHTML = '<section class="card stack"><h2>Base de clientes</h2><div id="contagem">' + msg('Contando...', 'info') + '</div>' +
    '<div><label for="arquivo">Planilha do Excel (.xlsx, .xls ou .csv)</label><input id="arquivo" type="file" accept=".xlsx,.xls,.csv"></div>' +
    '<p class="muted" style="margin:0">A planilha precisa ter uma coluna com o CPF e outra com o nome. Uma coluna de valor do bônus é opcional. Todas as outras colunas ficam disponíveis na tela de busca.</p>' +
    '<div id="imp"></div></section>';
  var n = await S.sb.from('clientes').select('id', { count: 'exact', head: true });
  $('#contagem').innerHTML = n.error ? msg('Não foi possível contar: ' + traduzErro(n.error), 'err') : msg('Clientes na base: ' + (n.count || 0), 'info');
  $('#arquivo').addEventListener('change', async function(ev){
    var f = ev.target.files[0]; if (!f) return;
    try {
      var wb = XLSX.read(await f.arrayBuffer(), { type: 'array', cellDates: true, dateNF: 'dd/mm/yyyy' });
      var nomeAba = wb.SheetNames[0], rows = XLSX.utils.sheet_to_json(wb.Sheets[nomeAba], { defval: '', raw: false, dateNF: 'dd/mm/yyyy' });
      if (!rows.length){ $('#imp').innerHTML = msg('A planilha está vazia.', 'warn'); return; }
      var heads = Object.keys(rows[0]);
      function achar(pred){ return heads.find(function(h){ return pred(norm(h)); }) || ''; }
      S.imp = { rows: rows, heads: heads, aba: nomeAba, arq: f.name, map: {
        cpf: achar(function(h){ return h.indexOf('cpf') >= 0; }),
        nome: achar(function(h){ return h === 'nome' || h === 'cliente' || h.indexOf('nome') >= 0; }),
        valor: achar(function(h){ return h.indexOf('valor') >= 0 || h.indexOf('bonus') >= 0; }) } };
      impTela();
    } catch (e){ $('#imp').innerHTML = msg('Não foi possível ler o arquivo: ' + traduzErro(e), 'err'); }
  });
}
function processarImp(){
  var m = S.imp.map, vistos = {}, validos = [], invalidos = [], dup = 0;
  S.imp.rows.forEach(function(r, i){
    var d = onlyDigits(r[m.cpf]); if (d.length > 0 && d.length < 11) d = d.padStart(11, '0');
    var nome = String(r[m.nome] == null ? '' : r[m.nome]).trim();
    if (!validCPF(d) || !nome){ invalidos.push(i + 2); return; }
    if (vistos[d]) dup++;
    var dados = {}; S.imp.heads.forEach(function(h){ var v = r[h]; if (v !== '' && v != null) dados[h] = String(v); });
    vistos[d] = { cpf: d, nome: nome, valor_bonus: m.valor ? parseValor(r[m.valor]) : null, dados: dados };
  });
  Object.keys(vistos).forEach(function(k){ validos.push(vistos[k]); });
  return { validos: validos, invalidos: invalidos, dup: dup };
}
function impTela(){
  var m = S.imp.map;
  function sel(id, rotulo, valor, opcional){
    return '<div class="grow"><label for="' + id + '">' + rotulo + '</label><select id="' + id + '">' + (opcional ? '<option value="">(nenhuma)</option>' : '<option value="">Escolha a coluna</option>') +
      S.imp.heads.map(function(h){ return '<option value="' + esc(h) + '"' + (h === valor ? ' selected' : '') + '>' + esc(h) + '</option>'; }).join('') + '</select></div>';
  }
  $('#imp').innerHTML = '<div class="stack"><div class="msg info">Arquivo: ' + esc(S.imp.arq) + ' (aba ' + esc(S.imp.aba) + ', ' + S.imp.rows.length + ' linhas)</div>' +
    '<div class="row">' + sel('m-cpf', 'Coluna do CPF', m.cpf, false) + sel('m-nome', 'Coluna do nome', m.nome, false) + sel('m-valor', 'Coluna do valor do bônus', m.valor, true) + '</div>' +
    '<div id="resumo"></div>' +
    '<label class="chk"><input type="checkbox" id="substituir"> Apagar a base atual antes de importar (substitui tudo)</label>' +
    '<button class="btn" id="importar">Importar</button><div id="imp-msg"></div></div>';
  function atualizar(){
    S.imp.map = { cpf: $('#m-cpf').value, nome: $('#m-nome').value, valor: $('#m-valor').value };
    if (!S.imp.map.cpf || !S.imp.map.nome){ $('#resumo').innerHTML = msg('Escolha as colunas do CPF e do nome.', 'warn'); $('#importar').disabled = true; return; }
    var p = processarImp();
    $('#resumo').innerHTML = msg(p.validos.length + ' clientes válidos' + (p.dup ? ', ' + p.dup + ' CPF repetido(s) na planilha (vale a última linha)' : '') +
      (p.invalidos.length ? ', ' + p.invalidos.length + ' linha(s) ignorada(s) por CPF inválido ou nome vazio (ex.: linhas ' + p.invalidos.slice(0, 6).join(', ') + ')' : '') + '.', p.invalidos.length ? 'warn' : 'ok');
    $('#importar').disabled = !p.validos.length;
  }
  ['m-cpf', 'm-nome', 'm-valor'].forEach(function(id){ $('#' + id).addEventListener('change', atualizar); });
  $('#substituir').addEventListener('change', function(){ $('#importar').textContent = this.checked ? 'Apagar a base e importar' : 'Importar'; });
  $('#importar').addEventListener('click', importar);
  atualizar();
}
async function importar(){
  var btn = $('#importar'), out = $('#imp-msg'), p = processarImp(), subst = $('#substituir').checked;
  btn.disabled = true; out.innerHTML = msg('Importando...', 'info');
  try {
    if (subst){
      var del = await S.sb.from('clientes').delete().gt('id', 0);
      if (del.error) throw del.error;
    }
    for (var i = 0; i < p.validos.length; i += 500){
      var up = await S.sb.from('clientes').upsert(p.validos.slice(i, i + 500), { onConflict: 'cpf' });
      if (up.error) throw up.error;
      out.innerHTML = msg('Importando... ' + Math.min(i + 500, p.validos.length) + ' de ' + p.validos.length, 'info');
    }
    out.innerHTML = msg('Importação concluída: ' + p.validos.length + ' clientes.', 'ok');
    var n = await S.sb.from('clientes').select('id', { count: 'exact', head: true });
    if (!n.error) $('#contagem').innerHTML = msg('Clientes na base: ' + (n.count || 0), 'info');
  } catch (e){ out.innerHTML = msg('Falha na importação: ' + traduzErro(e), 'err'); }
  btn.disabled = false;
}
function adminConfig(){
  var c = S.cfg;
  $('#admin-corpo').innerHTML = '<section class="card stack"><h2>Configurações do documento</h2>' +
    '<div class="row"><div class="grow"><label for="c-emp">Empreendimento</label><input id="c-emp" type="text" value="' + esc(c.empreendimento) + '"></div>' +
    '<div class="grow"><label for="c-empresa">Empresa</label><input id="c-empresa" type="text" value="' + esc(c.empresa) + '"></div></div>' +
    '<div class="row"><div class="grow"><label for="c-valor">Valor padrão do Cheque Bônus (R$), se a base não trouxer</label><input id="c-valor" type="text" inputmode="decimal" value="' + esc(valorInput(c.valor_padrao)) + '"></div>' +
    '<div class="grow"><label for="c-resp">Responsável pela entrega (opcional)</label><input id="c-resp" type="text" value="' + esc(c.responsavel) + '"></div></div>' +
    '<div><label for="c-texto">Texto complementar no documento (opcional)</label><textarea id="c-texto">' + esc(c.texto_complementar) + '</textarea></div>' +
    '<div id="cfg-msg"></div><button class="btn" id="cfg-salvar">Salvar configurações</button></section>';
  $('#cfg-salvar').addEventListener('click', async function(){
    var v = { empreendimento: $('#c-emp').value.trim() || 'EPLENUM RESERVE', empresa: $('#c-empresa').value.trim() || 'Emais Urbanismo',
      valor_padrao: parseValor($('#c-valor').value), responsavel: $('#c-resp').value.trim(), texto_complementar: $('#c-texto').value.trim() };
    var r = await S.sb.from('configuracoes').upsert({ chave: 'documento', valor: v, atualizado_em: new Date().toISOString() });
    if (r.error){ $('#cfg-msg').innerHTML = msg('Não foi possível salvar: ' + traduzErro(r.error), 'err'); return; }
    S.cfg = Object.assign(S.cfg, v); toast('Configurações salvas');
    $('#cfg-msg').innerHTML = msg('Configurações salvas.', 'ok');
  });
}
async function adminUsuarios(){
  $('#admin-corpo').innerHTML = '<section class="card stack"><h2>Novo usuário</h2>' +
    '<div class="row"><div class="grow"><label for="u-email">E-mail</label><input id="u-email" type="email" autocomplete="off"></div>' +
    '<div class="grow"><label for="u-senha">Senha (mínimo 8 caracteres)</label><input id="u-senha" type="text" autocomplete="off" spellcheck="false"></div>' +
    '<button class="btn sec" id="u-gerar" type="button">Gerar senha</button><button class="btn" id="u-criar" type="button">Criar usuário</button></div>' +
    '<div id="u-msg"></div><p class="muted" style="margin:0">Todo usuário criado aqui entra como operador: busca clientes e gera documentos, sem acesso à administração. Anote a senha e passe para a pessoa, ela não volta a aparecer.</p></section>' +
    '<section class="card stack"><h2>Usuários cadastrados</h2><div id="usr">' + msg('Carregando...', 'info') + '</div></section>';
  $('#u-gerar').addEventListener('click', function(){ $('#u-senha').value = gerarSenha(); });
  $('#u-criar').addEventListener('click', async function(){
    var btn = this, out = $('#u-msg'), email = $('#u-email').value.trim(), senha = $('#u-senha').value;
    if (!email || senha.length < 8){ out.innerHTML = msg('Informe o e-mail e uma senha com pelo menos 8 caracteres.', 'warn'); return; }
    btn.disabled = true; out.innerHTML = msg('Criando...', 'info');
    try {
      await chamarUsuarios({ acao: 'criar', email: email, senha: senha });
      out.innerHTML = msg('Usuário criado: ' + email + '. Passe a senha para a pessoa.', 'ok');
      $('#u-email').value = ''; $('#u-senha').value = '';
      await carregarUsuarios();
    } catch (e){ out.innerHTML = msg(traduzErro(e), 'err'); }
    btn.disabled = false;
  });
  carregarUsuarios();
}
async function carregarUsuarios(){
  var r = await S.sb.from('perfis').select('id,email,papel,criado_em').order('criado_em');
  var box = $('#usr'); if (!box) return;
  if (r.error){ box.innerHTML = msg('Erro: ' + traduzErro(r.error), 'err'); return; }
  box.innerHTML = '<div class="lista">' + (r.data || []).map(function(u){
    return '<div class="item"><div class="info"><b>' + esc(u.email) + '</b><span>Criado em ' + esc(new Date(u.criado_em).toLocaleDateString('pt-BR')) + '</span></div>' +
      '<span class="tag">' + (u.papel === 'admin' ? 'Administrador' : 'Operador') + '</span>' +
      '<button class="btn sec sm" data-troca="' + esc(u.id) + '">Trocar senha</button>' +
      '<div class="row troca" style="display:none;width:100%"><div class="grow"><label>Nova senha (mínimo 8 caracteres)</label><input type="text" class="nova-senha" autocomplete="off" spellcheck="false"></div>' +
      '<button class="btn sec sm" data-gera="1" type="button">Gerar senha</button><button class="btn sm" data-salva="' + esc(u.id) + '" type="button">Salvar senha</button><div class="troca-msg" style="width:100%"></div></div></div>';
  }).join('') + '</div>';
  box.querySelectorAll('[data-troca]').forEach(function(b){
    b.addEventListener('click', function(){
      var linha = b.closest('.item').querySelector('.troca');
      linha.style.display = linha.style.display === 'none' ? 'flex' : 'none';
    });
  });
  box.querySelectorAll('[data-gera]').forEach(function(b){
    b.addEventListener('click', function(){ b.closest('.troca').querySelector('.nova-senha').value = gerarSenha(); });
  });
  box.querySelectorAll('[data-salva]').forEach(function(b){
    b.addEventListener('click', async function(){
      var linha = b.closest('.troca'), senha = linha.querySelector('.nova-senha').value, out = linha.querySelector('.troca-msg');
      if (senha.length < 8){ out.innerHTML = msg('A senha precisa ter pelo menos 8 caracteres.', 'warn'); return; }
      b.disabled = true; out.innerHTML = msg('Salvando...', 'info');
      try {
        await chamarUsuarios({ acao: 'trocar_senha', id: b.getAttribute('data-salva'), senha: senha });
        out.innerHTML = msg('Senha trocada. Passe a nova senha para a pessoa.', 'ok');
        linha.querySelector('.nova-senha').value = '';
      } catch (e){ out.innerHTML = msg(traduzErro(e), 'err'); }
      b.disabled = false;
    });
  });
}

/* ---------------- início ---------------- */
async function init(){
  if (!configurado()){ renderSetup(); return; }
  if (!window.supabase){ app.innerHTML = '<div class="wrap"><div class="card login">' + msg('Não foi possível carregar o Supabase. Verifique a internet e recarregue.', 'err') + '</div></div>'; return; }
  S.sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  S.sb.auth.onAuthStateChange(function(ev){
    if (ev === 'SIGNED_OUT'){ S.user = null; S.cliente = null; S.ultimo = null; S.papel = 'operador'; renderLogin(); }
  });
  var s = await S.sb.auth.getSession();
  if (s.data && s.data.session) await entrar(s.data.session.user); else renderLogin();
}
init();
})();
</script>
